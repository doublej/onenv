name: Release

# Cut a release locally with `just release <bump>` (bumps, changelogs, tags),
# then `just release-push`. Pushing the v* tag triggers this workflow, which
# is the single source of truth for published binaries.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Verify tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=v${tag}  package.json=${pkg}"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${tag} does not match package.json version ${pkg}"
            exit 1
          fi

      - name: Quality gate
        run: |
          bun run biome check src/
          bunx tsc --noEmit
          bun run test

      - name: Build binaries
        run: bun run build:binaries

      - name: Extract release notes from CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v p="## ${tag} " 'index($0,p)==1{f=1;print;next} f&&/^## /{exit} f{print}' CHANGELOG.md > RELEASE_NOTES.md
          if [ -s RELEASE_NOTES.md ]; then echo "using CHANGELOG section for ${tag}"; else echo "no CHANGELOG section for ${tag}; falling back to autogenerated notes"; fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -s RELEASE_NOTES.md ]; then
            gh release create "$tag" dist-bin/* --title "$tag" --notes-file RELEASE_NOTES.md --verify-tag
          else
            gh release create "$tag" dist-bin/* --title "$tag" --generate-notes --verify-tag
          fi
